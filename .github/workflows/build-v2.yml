name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Find and unpack Android project
        run: |
          set -e
          PROJECT_ZIP="$(find . -maxdepth 1 -type f -name 'photo-cleaner-project*.zip' -print -quit)"
          if [ -z "$PROJECT_ZIP" ]; then
            echo "找不到 photo-cleaner-project*.zip"
            exit 1
          fi
          echo "使用專案：$PROJECT_ZIP"
          rm -rf android-src
          mkdir -p android-src
          unzip -q "$PROJECT_ZIP" -d android-src
          test -f android-src/settings.gradle
          test -f android-src/build.gradle
          test -f android-src/app/build.gradle

      - name: Build Debug APK
        working-directory: android-src
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-cleaner-debug-apk
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
